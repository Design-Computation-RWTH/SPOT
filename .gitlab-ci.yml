# Full project: https://gitlab.com/pages/plain-html
image: busybox

pages:
  stage: deploy
  environment: production
  script:
    - mkdir -p public public/am
    - cp -r Documentation/SpaceTypeOntologyDoc/* public/
    - cp -r Documentation/SpotAmDoc/* public/am/
    - mv public/index-en.html public/index.html
    - mv public/am/index-en.html public/am/index.html
    - echo "The site will be deployed to $CI_PAGES_URL"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
